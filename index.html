<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>設備マップ CSV対応版</title>

  <style>
    /* ============================================================
       1. 共通カラー・基本設定
       ============================================================ */
    :root {
      --blue: #1565c0;
      --dark: #0d3f7a;
      --light: #e8f2ff;
      --red: #e53935;
      --red-light: #ffe8e7;
      --background: #edf2f7;
      --text: #172033;
      --muted: #64748b;
      --line: #d7e0ea;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      color: var(--text);
      background: var(--background);
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ============================================================
       2. ヘッダー・CSV読み込み・検索
       ============================================================ */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      min-width: 180px;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
    }

    .brand p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .csv-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .csv-button {
      display: inline-block;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      font-weight: 700;
    }

    .csv-status {
      max-width: 250px;
      color: var(--muted);
      font-size: 12px;
    }

    .label-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      font-size: 13px;
    }

    .search-wrap {
      position: relative;
      z-index: 150;
      width: min(430px, 100%);
      margin-left: auto;
    }

    .search-wrap input {
      width: 100%;
      padding: 12px 42px 12px 16px;
      border: 2px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: #f8fafc;
    }

    .clear-search {
      position: absolute;
      right: 8px;
      top: 50%;
      width: 30px;
      height: 30px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
    }

    .search-suggestions {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      z-index: 160;
      max-height: 320px;
      overflow-y: auto;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: white;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.15);
    }

    .search-suggestions.open {
      display: block;
    }

    .suggestion-button {
      display: flex;
      width: 100%;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 12px;
      border: 0;
      border-radius: 10px;
      background: white;
      text-align: left;
    }

    .suggestion-button:hover,
    .suggestion-button.active {
      background: var(--light);
    }

    .suggestion-name {
      font-weight: 700;
    }

    .suggestion-meta {
      color: var(--muted);
      font-size: 12px;
    }

    .suggestion-empty {
      padding: 12px;
      color: var(--muted);
      text-align: center;
    }

    /* ============================================================
       3. 共通画面レイアウト
       ============================================================ */
    main {
      width: min(1320px, calc(100% - 28px));
      margin: 24px auto 50px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .back-button {
      padding: 9px 14px;
      border: 1px solid var(--line);
      background: white;
      font-weight: 700;
    }

    .breadcrumb {
      color: var(--muted);
      font-size: 14px;
    }

    .search-message {
      display: none;
      margin-bottom: 14px;
      padding: 12px 16px;
      border: 1px solid #ffb8b5;
      color: #9f1714;
      background: var(--red-light);
      font-weight: 700;
    }

    .card {
      overflow: hidden;
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(15, 23, 42, 0.10);
    }

    .card-head {
      padding: 20px 24px 14px;
    }

    .card-head h2 {
      margin: 0;
    }

    .card-head p {
      margin: 6px 0 0;
      color: var(--muted);
    }

    .card-body {
      padding: 18px 24px 24px;
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* ============================================================
       4. 全体マップ・建屋ボタン
       ============================================================ */
    .map-canvas {
      position: relative;
      width: 100%;
      aspect-ratio: 2267 / 1367;
      overflow: hidden;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
    }

    .map-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .building {
      position: absolute;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 5px;
      border: 2px solid var(--dark);
      border-radius: 0;
      color: white;
      background: rgba(21, 101, 192, 0.82);
      text-align: center;
    }

    .building.no-floor {
      background: rgba(71, 85, 105, 0.86);
    }

    .building-name {
      display: block;
      font-weight: 900;
    }

    .building-floor {
      display: block;
      margin-top: 3px;
      font-size: 11px;
    }

    .building.search-hit {
      background: var(--red);
    }

    .building.search-dim {
      opacity: 0.25;
    }

    /* ============================================================
       5. 階選択画面
       ============================================================ */
    .floor-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 12px;
    }

    .floor-button {
      min-height: 90px;
      padding: 14px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: white;
      text-align: left;
    }

    .floor-button strong {
      display: block;
      font-size: 24px;
    }

    .floor-button small {
      color: var(--muted);
    }

    .floor-button.roof {
      background: #eef9f3;
    }

    .floor-button.basement {
      background: #f4f0ff;
    }

    .floor-button.search-hit {
      color: white;
      background: var(--red);
    }

    .floor-button.search-hit small {
      color: white;
    }

    .floor-button.search-dim {
      opacity: 0.35;
    }

    /* ============================================================
       6. 階マップ
       マップを上、設備一覧を下に配置
       ============================================================ */

.floor-layout {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* マップ全体 */
/* =========================================
   マップ表示領域
   ========================================= */

.floor-map-viewport {
  position: relative;
  width: 100%;
  overflow: hidden;
}

/*
  PCで設備位置を作成した基準マップ。
  背景画像・設備・文字を全部この中に配置する。
*/
.floor-map {
  position: relative;
  width: 1000px;
  transform-origin: left top;
  border: 2px solid #cbd5e1;
  background: #f8fafc;
}

/* 背景画像 */
.floor-image {
  display: block;
  width: 1000px;
  height: auto;
}


    /* ============================================================
       7. 設備マーカー・設備名
       ============================================================ */
    .equipment-marker {
      position: absolute;
      z-index: 5;
      width: 1px;
      height: 1px;
      padding: 0;
      transform: translate(-50%, -50%);
      border: 0;
      background: transparent;
    }

    .marker-symbol {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(0, 0, 0, 0.45);
      box-shadow: 0 3px 8px rgba(15, 23, 42, 0.28);
    }

    .marker-name {
      position: absolute;
      text-align: center;
      line-height: 1.1;
      white-space: nowrap;
      pointer-events: none;
    }

    /* 大設備の名称は図形内へ表示 */
    .inside-label {
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      overflow: hidden;
      text-overflow: ellipsis;
      color: white;
      text-shadow:
        1px 1px 2px black,
        -1px -1px 2px black,
        1px -1px 2px black,
        -1px 1px 2px black;
    }

    /* 小設備の名称は図形付近へ表示 */
    .outside-label {
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: transparent;
      z-index: 30;
      text-shadow:
        1px 1px 2px black,
        -1px -1px 2px black,
        1px -1px 2px black,
        -1px 1px 2px black;
    }

    /* 小設備名を3段に分散して重なりを軽減 */
    .label-row-1 {
      top: calc(100% - 30px);
    }

    .label-row-2 {
      top: calc(100% - 20px);
    }

    .label-row-3 {
      top: calc(100% - 10px);
    }

    /* 設備の形 */
    .shape-circle {
      border-radius: 50%;
    }

    .shape-square {
      border-radius: 0;
    }

    .shape-diamond {
      transform: translate(-50%, -50%) rotate(45deg);
    }

    .shape-triangle {
      border: 0;
      clip-path: polygon(50% 0, 0 100%, 100% 100%);
    }

    .shape-hexagon {
      border: 0;
      clip-path: polygon(
        25% 0,
        75% 0,
        100% 50%,
        75% 100%,
        25% 100%,
        0 50%
      );
    }

    .shape-star {
      border: 0;
      clip-path: polygon(
        50% 0,
        61% 35%,
        98% 35%,
        68% 57%,
        79% 91%,
        50% 70%,
        21% 91%,
        32% 57%,
        2% 35%,
        39% 35%
      );
    }

    .shape-rectangle {
      border-radius: 0;
    }

    .equipment-marker.search-hit .marker-symbol {
      outline: 5px solid rgba(229, 57, 53, 0.48);
    }

    .equipment-marker.search-dim {
      opacity: 0.18;
    }

    /* ============================================================
       8. マップ下の設備一覧・凡例
       ============================================================ */
    .equipment-list {
      width: 100%;
      padding: 16px;
      border: 1px solid var(--line);
      background: white;
    }

    .equipment-list h3 {
      margin: 0 0 12px;
    }

    #equipmentList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
    }

    .equipment-list button {
      display: flex;
      width: 100%;
      min-height: 64px;
      align-items: center;
      gap: 10px;
      margin: 0;
      padding: 11px;
      border: 1px solid var(--line);
      background: white;
      text-align: left;
    }

    .equipment-list button.search-hit {
      border-color: var(--red);
      background: var(--red-light);
    }

    .list-symbol {
      display: inline-block;
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border: 1px solid rgba(0, 0, 0, 0.4);
    }

    .list-symbol.shape-diamond {
      transform: rotate(45deg) scale(0.75);
    }

    .equipment-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      background: #f8fafc;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    /* ============================================================
       9. 設備詳細モーダル
       ============================================================ */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      padding: 18px;
      background: rgba(15, 23, 42, 0.56);
    }

    .modal-backdrop.open {
      display: grid;
      place-items: center;
    }

    .modal {
      width: min(720px, 100%);
      max-height: 92vh;
      overflow: auto;
      background: white;
      border-radius: 16px;
    }

    .modal-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .close-modal {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 50%;
      font-size: 23px;
    }

    .equipment-photo {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 7;
      object-fit: contain;
      background: #e8edf3;
    }

    .photo-placeholder {
      display: grid;
      place-items: center;
      width: 100%;
      aspect-ratio: 16 / 7;
      background: #e8edf3;
      color: var(--muted);
    }

    .modal-content {
      padding: 22px;
    }

    .spec-table {
      width: 100%;
      border-collapse: collapse;
    }

    .spec-table th,
    .spec-table td {
      padding: 11px 9px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .guide {
      margin-top: 18px;
      padding: 16px;
      border-left: 5px solid #16865b;
      background: #edf9f4;
      font-size: 13px;
    }

    code {
      padding: 2px 5px;
      background: #e7edf4;
    }

    /* ============================================================
       10. スマートフォン・狭い画面
       ============================================================ */
    @media (max-width: 900px) {
      header {
        align-items: stretch;
        flex-direction: column;
      }

      .search-wrap {
        width: 100%;
        margin: 0;
      }

      .csv-controls {
        flex-wrap: wrap;
      }


      .building-floor {
        display: none;
      }
    }
  </style>
</head>

<body>
  <!-- ============================================================
       ヘッダー
       ============================================================ -->
  <header>
    <div class="brand">
      <h1>設備マップ</h1>
      <p>CSVで設備を管理</p>
    </div>

    <div class="csv-controls">

  <label
      class="csv-button"
      for="csvInput">
      CSV読込
  </label>

  <input
      id="csvInput"
      type="file"
      accept=".csv"
      hidden>

  <span
      id="csvStatus"
      class="csv-status">
      未読込
  </span>

  <label class="label-toggle">
      <input
          id="showAllLabels"
          type="checkbox"
          checked>
      全設備名を表示
  </label>

</div>

    <div class="search-wrap">
      <input
        id="searchInput"
        type="search"
        placeholder="設備名を検索"
        autocomplete="off"
      >
      <button id="clearSearch" class="clear-search">×</button>
      <div id="searchSuggestions" class="search-suggestions"></div>
    </div>
  </header>

  <!-- ============================================================
       メイン画面
       ============================================================ -->
  <main>
    <div id="searchMessage" class="search-message"></div>

    <div class="toolbar">
      <button id="backButton" class="back-button" style="display: none;">
        ← 戻る
      </button>
      <div id="breadcrumb" class="breadcrumb">全体マップ</div>
    </div>

    <!-- 全体マップ -->
    <section id="overviewView" class="view active card">
      <div class="card-head">
        <h2>全体マップ</h2>
        <p>CSVを読み込むと設備件数が反映されます。</p>
      </div>

      <div class="card-body">
        <div id="overviewMap" class="map-canvas">
          <img src="maps/map1.png" class="map-image" alt="全体マップ">
        </div>
      </div>
    </section>

    <!-- 階選択 -->
    <section id="floorsView" class="view card">
      <div class="card-head">
        <h2 id="floorTitle"></h2>
        <p>表示する階を選択してください。</p>
      </div>

      <div class="card-body">
        <div id="floorGrid" class="floor-grid"></div>
      </div>
    </section>

    <!-- 階・設備エリアマップ -->
    <section id="floorMapView" class="view card">
      <div class="card-head">
        <h2 id="floorMapTitle"></h2>
        <div id="equipmentLegend" class="equipment-legend"></div>
      </div>

      <div class="card-body floor-layout">
        <div id="floorMapViewport" class="floor-map-viewport">
  <div id="floorMap" class="floor-map">
    <img
      id="floorImage"
      class="floor-image"
      alt="階マップ"
    >
  </div>
</div>

        <aside class="equipment-list">
          <h3>このマップの設備</h3>
          <div id="equipmentList"></div>
        </aside>
      </div>
    </section>

    <div class="guide">
      <strong>使い方：</strong>
      Excelで <code>equipment.csv</code> を編集し、
      「CSV UTF-8」形式で保存してから読み込んでください。
    </div>
  </main>

  <!-- ============================================================
       設備詳細モーダル
       ============================================================ -->
  <div id="modalBackdrop" class="modal-backdrop">
    <article class="modal">
      <div class="modal-top">
        <strong>設備詳細</strong>
        <button id="closeModal" class="close-modal">×</button>
      </div>

      <div id="photoArea"></div>

      <div class="modal-content">
        <h2 id="detailName"></h2>
        <div id="detailLocation"></div>
        <p id="detailDescription"></p>

        <table class="spec-table">
          <tbody id="detailSpecs"></tbody>
        </table>
      </div>
    </article>
  </div>

  <script>
    "use strict";

    /* ============================================================
       1. 建屋・設備エリア設定
       ============================================================ */
    
let BUILDINGS = [];
let FLOORS = [];


    /* ============================================================
       2. 設備種類ごとの表示スタイル
       ============================================================ */
    const EQUIPMENT_TYPE_STYLE = {
      pump: {
        label: "ポンプ",
        shape: "square",
        color: "#00BCD4"
      },
      fan: {
        label: "ファン",
        shape: "diamond",
        color: "#4CAF50"
      },
      valve: {
        label: "弁",
        shape: "triangle",
        color: "#F44336"
      },
      panel: {
        label: "配電盤・制御盤",
        shape: "square",
        color: "#2196F3"
      },
      motor: {
        label: "電動機",
        shape: "square",
        color: "#3F51B5"
      },
      tank: {
        label: "タンク・槽",
        shape: "circle",
        color: "#FF9800"
      },
      silo: {
        label: "サイロ",
        shape: "circle",
        color: "#795548"
      },
      conveyor: {
        label: "コンベヤ",
        shape: "rectangle",
        color: "#607D8B"
      },
      exchanger: {
        label: "熱交換器",
        shape: "square",
        color: "#9C27B0"
      },
      turbine: {
        label: "タービン",
        shape: "star",
        color: "#673AB7"
      },
      boiler: {
        label: "ボイラ",
        shape: "star",
        color: "#FF5722"
      },
      other: {
        label: "その他",
        shape: "square",
        color: "#6B7280"
      }
    };

    /* ===========================================================
    /* ============================================================
       4. 状態管理
       ============================================================ */
    let EQUIPMENT = [];
    let currentView = "overview";
    let selectedBuildingId = null;
    let selectedFloor = null;
    let activeSuggestionIndex = -1;

    /* ============================================================
       5. 画面部品の取得
       ============================================================ */
    const searchInput = document.getElementById("searchInput");
    const suggestions = document.getElementById("searchSuggestions");
    const searchMessage = document.getElementById("searchMessage");
    const backButton = document.getElementById("backButton");
    const breadcrumb = document.getElementById("breadcrumb");
    const showAllLabels = document.getElementById("showAllLabels");
    const csvStatus = document.getElementById("csvStatus");

    /* ============================================================
       6. CSV読み込み処理
       ============================================================ */

    /**
     * CSV文字列を行・列へ分解します。
     * ダブルクォート内のカンマや改行にも対応しています。
     */
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let quoted = false;

      // UTF-8 BOMを除去
      text = text.replace(/^\uFEFF/, "");

      for (let index = 0; index < text.length; index++) {
        const character = text[index];
        const nextCharacter = text[index + 1];

        if (
          character === '"' &&
          quoted &&
          nextCharacter === '"'
        ) {
          cell += '"';
          index++;
        } else if (character === '"') {
          quoted = !quoted;
        } else if (character === "," && !quoted) {
          row.push(cell);
          cell = "";
        } else if (
          (character === "\n" || character === "\r") &&
          !quoted
        ) {
          if (character === "\r" && nextCharacter === "\n") {
            index++;
          }

          row.push(cell);

          if (row.some(value => value !== "")) {
            rows.push(row);
          }

          row = [];
          cell = "";
        } else {
          cell += character;
        }
      }

      row.push(cell);

      if (row.some(value => value !== "")) {
        rows.push(row);
      }

      if (rows.length < 2) {
        return [];
      }

      const headers = rows[0].map(header => header.trim());

      return rows.slice(1).map(values => {
        return Object.fromEntries(
          headers.map((header, index) => [
            header,
            (values[index] ?? "").trim()
          ])
        );
      });
    }

    /** 数値へ変換。空欄や不正値の場合はfallbackを返します。 */
    function toNumber(value, fallback) {
      const number = Number(value);

      return value !== "" && Number.isFinite(number)
        ? number
        : fallback;
    }

    /** CSVの表示フラグを真偽値へ変換します。 */
    function toBoolean(value) {
      const trueValues = [
        "true", "1", "yes", "on", "表示", "する"
      ];

      return trueValues.includes(
        String(value).trim().toLowerCase()
      );
    }

    /** specs列を配列へ変換します。 */
    function parseSpecs(value) {
      if (!value) {
        return [];
      }

      try {
        const parsed = JSON.parse(value);
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return value
          .split("|")
          .map(pair => pair.split(":"))
          .filter(pair => pair.length >= 2);
      }
    }

    /** CSVの1行を設備オブジェクトへ変換します。 */
    function normalizeRow(row) {
      return {
        id: row.id,
        name: row.name,
        type: row.type || "other",
        category: row.category || "",
        buildingId: row.buildingId,
        floor: row.floor || "",
        x: toNumber(row.x, 50),
        y: toNumber(row.y, 50),
        size: toNumber(row.size, null),
        width: toNumber(row.width, null),
        height: toNumber(row.height, null),
        description: row.description || "",
        image: row.image || "",
        specs: parseSpecs(row.specs),
        showLabel: toBoolean(row.showLabel)
      };
    }

   建屋CSV変換

function normalizeBuildingRow(row) {
  return {
    id: row.id,
    name: row.name,
    type: row.type || "building",
    x: toNumber(row.x, 0),
    y: toNumber(row.y, 0),

/* ============================================================

function normalizeFloorRow(row) {

/**
 * CSV読込ボタンで選択されたCSVを読み込みます*
 */
async function loadCSVFile(file) {
  try {
    csvStatus.textContent = "CSV読込中...";

    const text = await file.text();

    const rows = parseCSV(text)
      .map(normalizeRow)
      .filter(item => {
        return (
          item.id &&
          item.name &&
          item.buildingId
        );
      });

    if (rows.length === 0) {
      throw new Error(
        "有効な設備データがありません"
      );
    }

    // 読み込んだ設備を保存
    EQUIPMENT = rows;

    // 読込結果をヘッダーへ表示
    csvStatus.textContent =
      file.name + "：" + rows.length + "件読込";

    // 現在表示中の画面を再描画
    renderCurrentView();

  } catch (error) {
    csvStatus.textContent =
      "CSV読込失敗：" + error.message;

    console.error(
      "選択したCSVの読込に失敗しました。",
      error
    );
  }
}

   ============================================================ */

/**
 * GitHub Pages上に置かれた equipment.csv を読み込みます。
 *
 * index.html と equipment.csv は、
 * GitHubリポジトリの同じ階層へ配置してください。

/* ============================================================
   GitHub Pages用
   3つのCSVを自動読み込み
   ============================================================ */

async function loadDefaultCSV() {

  try {

    csvStatus.textContent =
      "CSVデータ読込中...";

    const cache = "?v=" + Date.now();

    /* 3ファイルを同時に取得 */
    const [
      buildingsResponse,
      floorsResponse,
      equipmentResponse
    ] = await Promise.all([
      fetch("./buildings.csv" + cache),
      fetch("./floors.csv" + cache),
      fetch("./equipment.csv" + cache)
    ]);


    /* =========================
       ファイル存在確認
       ========================= */

    if (!buildingsResponse.ok) {
      throw new Error(
        "buildings.csv が見つかりません"
      );
    }

    if (!floorsResponse.ok) {
      throw new Error(
        "floors.csv が見つかりません"
      );
    }

    if (!equipmentResponse.ok) {
      throw new Error(
        "equipment.csv が見つかりません"
      );
    }


    /* =========================
       CSVを文字列として取得
       ========================= */

    const [
      buildingsText,
      floorsText,
      equipmentText
    ] = await Promise.all([
      buildingsResponse.text(),
      floorsResponse.text(),
      equipmentResponse.text()
    ]);


    /* =========================
       建屋
       ========================= */

    BUILDINGS = parseCSV(buildingsText)
      .map(normalizeBuildingRow)
      .filter(item => {
        return item.id && item.name;
      });


    /* =========================
       階
       ========================= */

    FLOORS = parseCSV(floorsText)
      .map(normalizeFloorRow)
      .filter(item => {
        return (
          item.buildingId &&
          item.floor
        );
      });


    /* =========================
       設備
       ========================= */

    EQUIPMENT = parseCSV(equipmentText)
      .map(normalizeRow)
      .filter(item => {
        return (
          item.id &&
          item.name &&
          item.buildingId
        );
      });


    /* =========================
       有効データ確認
       ========================= */

    if (!BUILDINGS.length) {
      throw new Error(
        "buildings.csv に有効な建屋がありません"
      );
    }

    if (!FLOORS.length) {
      throw new Error(
        "floors.csv に有効な階データがありません"
      );
    }


    /* =========================
       読込完了
       ========================= */

    csvStatus.textContent =
      "建屋 " +
      BUILDINGS.length +
      "件 / 階 " +
      FLOORS.length +
      "件 / 設備 " +
      EQUIPMENT.length +
      "件";


    renderCurrentView();


  } catch (error) {

    csvStatus.textContent =
      "CSV読込失敗：" +
      error.message;

    console.error(
      "CSVデータの読込に失敗しました。",
      error
    );

  }
}

    /* ============================================================

    function normalize(value) {
      return String(value || "")
        .trim()
        .toLocaleLowerCase("ja-JP");
    }

    function getEquipmentStyle(item) {
      return EQUIPMENT_TYPE_STYLE[item.type]
        || EQUIPMENT_TYPE_STYLE.other;
    }

    function getMatches() {
      const keyword = normalize(searchInput.value);

      if (!keyword) {
        return [];
      }

      return EQUIPMENT.filter(item => {
        const target = [
          item.name,
          item.category,
          item.description,
          item.floor,
          item.type
        ].join(" ");

        return normalize(target).includes(keyword);
      });
    }

    function getSuggestionItems() {
      const keyword = normalize(searchInput.value);
      const usedNames = new Set();

      if (!keyword) {
        return [];
      }

      return EQUIPMENT
        .filter(item => {
          const equipmentName = normalize(item.name);

          if (!equipmentName.startsWith(keyword)) {
            return false;
          }

          if (usedNames.has(equipmentName)) {
            return false;
          }

          usedNames.add(equipmentName);
          return true;
        })
        .slice(0, 10);
    }

    function closeSuggestions() {
      suggestions.classList.remove("open");
      suggestions.innerHTML = "";
      activeSuggestionIndex = -1;
    }

    function chooseSuggestion(item) {
      searchInput.value = item.name;
      closeSuggestions();
      searchInput.dispatchEvent(new Event("input"));
      searchInput.focus();
    }

    function renderSuggestions() {
      const keyword = searchInput.value.trim();

      if (!keyword) {
        closeSuggestions();
        return;
      }

      const items = getSuggestionItems();
      suggestions.innerHTML = "";
      activeSuggestionIndex = -1;

      if (!items.length) {
        suggestions.innerHTML =
          '<div class="suggestion-empty">候補はありません</div>';
        suggestions.classList.add("open");
        return;
      }

      items.forEach(item => {
        const building = BUILDINGS.find(value => {
          return value.id === item.buildingId;
        });

        const button = document.createElement("button");
        button.className = "suggestion-button";
        button.innerHTML =
          '<span class="suggestion-name">' + item.name + '</span>' +
          '<span class="suggestion-meta">' +
          (building ? building.name : "") +
          '・' + item.floor +
          '</span>';

        button.addEventListener("mousedown", event => {
          event.preventDefault();
          chooseSuggestion(item);
        });

        suggestions.appendChild(button);
      });

      suggestions.classList.add("open");
    }

    function moveSuggestion(direction) {
      const buttons = [
        ...suggestions.querySelectorAll(".suggestion-button")
      ];

      if (!buttons.length) {
        return;
      }

      activeSuggestionIndex =
        (activeSuggestionIndex + direction + buttons.length)
        % buttons.length;

      buttons.forEach((button, index) => {
        button.classList.toggle(
          "active",
          index === activeSuggestionIndex
        );
      });
    }

       ============================================================ */

    function createEquipmentMarker(
      item,
      searching,
      matchingEquipmentIds
    ) {
      const style = getEquipmentStyle(item);

      const width =
  Number(item.width) || Number(item.size) || 40;

const height =
  Number(item.height) || Number(item.size) || 40;


      const marker = document.createElement("button");
      marker.className = "equipment-marker";

      if (searching && matchingEquipmentIds.has(item.id)) {
        marker.classList.add("search-hit");
      }

      if (searching && !matchingEquipmentIds.has(item.id)) {
        marker.classList.add("search-dim");
      }

      marker.style.left = item.x + "%";
      marker.style.top = item.y + "%";

      /* 設備図形 */
      const symbol = document.createElement("span");
      symbol.className = "marker-symbol shape-" + style.shape;
      symbol.style.backgroundColor = style.color;
      symbol.style.width = width + "px";
      symbol.style.height = height + "px";
      marker.appendChild(symbol);

      /* 設備名 */
      const name = document.createElement("span");
      name.className = "marker-name";
      name.style.width = width + "px";

      // 7文字以上なら中央付近で2行に分割
      if (item.name.length > 6) {
        const center = Math.ceil(item.name.length / 2);

        name.innerHTML =
          item.name.substring(0, center) +
          "<br>" +
          item.name.substring(center);
      } else {
        name.textContent = item.name;
      }

      /* 設備の面積によって名称の位置を切り替え */
      const area = width * height;

      if (area >= 10000) {
        name.classList.add("inside-label");
      } else {
        name.classList.add("outside-label");

        // x座標を使って3段へ分散
        const labelRow = (Math.floor(item.x) % 3) + 1;
        name.classList.add("label-row-" + labelRow);
      }

      /* 文字数によって文字サイズを変更 */
      name.style.fontSize =
  item.name.length > 7
    ? "7px"
    : item.name.length > 3
      ? "10px"
      : "20px";


      /*
        チェックがONなら全名称を表示。
        OFFならCSVのshowLabelがTRUEの設備だけ表示。
      */
      if (showAllLabels.checked || item.showLabel) {
        marker.appendChild(name);
      }

      marker.addEventListener("click", () => {
        showEquipmentDetail(item);
      });

      return marker;
    }

/* ============================================================
   マップ全体を画面幅に合わせて同比率縮小
   ============================================================ */

function resizeFloorMap() {

  const BASE_MAP_WIDTH = 1000;

  const viewport =
    document.getElementById("floorMapViewport");

  const map =
    document.getElementById("floorMap");

  const image =
    document.getElementById("floorImage");

  if (!viewport || !map || !image) {
    return;
  }

  /* 表示可能な横幅 */
  const availableWidth =
    viewport.clientWidth;

  /* PCでは100%、スマホでは必要な分だけ縮小 */
  const scale =
    Math.min(
      availableWidth / BASE_MAP_WIDTH,
      1
    );

  /*
    背景画像・設備・設備名をまとめて縮小
  */
  map.style.transform =
    `scale(${scale})`;

  /*
    transformでは外側の高さが自動では縮まらないため、
    実際の表示高さにviewportを合わせる
  */
  const baseHeight =
    image.offsetHeight;

  viewport.style.height =
    (baseHeight * scale) + "px";
}

      /*
        同じCSVを続けて選択した場合にも
        changeイベントを発生させるため、
        読込後にinputの値を空にします。
      */
      await loadCSVFile(file);

      event.target.value = "";

    }
  );

}


    searchInput.addEventListener("input", () => {
      renderSuggestions();
      renderCurrentView();
    });

    searchInput.addEventListener("focus", renderSuggestions);

    searchInput.addEventListener("keydown", event => {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        moveSuggestion(1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        moveSuggestion(-1);
      } else if (
        event.key === "Enter" &&
        activeSuggestionIndex >= 0
      ) {
        event.preventDefault();

        const suggestionButtons =
          suggestions.querySelectorAll(".suggestion-button");

        suggestionButtons[activeSuggestionIndex].dispatchEvent(
          new MouseEvent("mousedown", { bubbles: true })
        );
      } else if (event.key === "Escape") {
        closeSuggestions();
      }
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".search-wrap")) {
        closeSuggestions();
      }
    });

    document
      .getElementById("clearSearch")
      .addEventListener("click", () => {
        searchInput.value = "";
        closeSuggestions();
        renderCurrentView();
        searchInput.focus();
      });

    backButton.addEventListener("click", () => {
      const building = BUILDINGS.find(item => {
        return item.id === selectedBuildingId;
      });

      if (
        currentView === "floorMap" &&
        building.type === "building"
      ) {
        selectedFloor = null;
        renderFloors();
        showView("floors");
      } else {
        selectedBuildingId = null;
        selectedFloor = null;
        renderOverview();
        showView("overview");
      }
    });

    document
      .getElementById("closeModal")
      .addEventListener("click", closeModal);

    document
      .getElementById("modalBackdrop")
      .addEventListener("click", event => {
        if (event.target.id === "modalBackdrop") {
          closeModal();
        }
      });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closeModal();
      }
    });

  /* ============================================================
   17. 初期表示
   ============================================================ */

/* 最初に建屋を表示 */
renderOverview();

/*
  GitHub Pagesなど、http または https で
  開いた場合だけCSVを自動読み込みします。
*/
if (
  location.protocol === "https:" ||
  location.protocol === "http:"
) {

  loadDefaultCSV();

} else {

  /*
    OneDrive同期フォルダやPC上から
    ダブルクリックで開いた場合。
  */
  csvStatus.textContent =
    "ローカルモード：CSV読込ボタンから選択";

}

window.addEventListener(
  "resize",
  () => {
    resizeFloorMap();
  }
);


  </script>
</body>
</html>
